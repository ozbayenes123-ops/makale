<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
body{font-family:Georgia,'Times New Roman',serif;max-width:44em;margin:2em auto;padding:0 1em;line-height:1.6;color:#111}
h1{font-size:1.6em;text-align:center}h2{font-size:1.25em;margin-top:2em}h3{font-size:1.1em}
.subtitle{text-align:center;font-style:italic;color:#444}
.toc{background:#f7f7f7;padding:1em 2em;border:1px solid #ddd}
.fnref a{text-decoration:none}ol.footnotes,ol{line-height:1.5}
</style>
</head>
<body>
<h1>{{title}}</h1>
<p class="subtitle">{{subtitle}}</p>
<nav class="toc">{{toc}}</nav>
{{content}}
{{footnotes}}
</body>
</html>
